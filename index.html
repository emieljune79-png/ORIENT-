<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orientation Access</title>
</head>

<body>

  <h1>🔐 Orientation Access</h1>
  <p>Enter the password to continue.</p>

  <input type="password" id="password" placeholder="Enter password">
  <button onclick="checkPassword()">ACCESS</button>

  <p id="error" style="color:red; display:none;">Incorrect password.</p>

  <script>
    const correctPassword = "ORIENT2026";

    function checkPassword() {
      const password = document.getElementById("password").value;

      if (password === correctPassword) {
        window.location.href = "https://canva.link/orientation-for-aji";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }
  </script>

</body>
</html>
