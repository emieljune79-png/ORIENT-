<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRADOC Orientation</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #0b0f0c;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 20px;
}

.card {
    background: #121814;
    border: 1px solid #29352d;
    border-radius: 18px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #1d2b22;
    border: 2px solid #477257;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

h1, h2 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #89968e;
    margin: 8px 0 25px;
    font-size: 14px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
}

.tab {
    flex: 1;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #2c3931;
    background: #18201b;
    color: #9daaa2;
    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    background: #356447;
    color: white;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

label {
    display: block;
    color: #b9c3bd;
    font-size: 13px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 17px;
    border-radius: 9px;
    border: 1px solid #2c3931;
    background: #0c110e;
    color: white;
    outline: none;
}

.login,
.action {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #356447;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.login:hover,
.action:hover {
    background: #417a56;
}

.message {
    display: none;
    margin-top: 17px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 13px;
}

.message.show {
    display: block;
}

.error {
    background: #351b1b;
    color: #ff9d9d;
}

.success {
    background: #193523;
    color: #9ce0ad;
}

.panel {
    display: none;
}

.panel.active {
    display: block;
}

.panel p {
    color: #9ba69f;
    text-align: center;
    line-height: 1.5;
    margin: 12px 0 20px;
}

.logout {
    margin-top: 10px;
    background: transparent;
    border: 1px solid #2c3931;
    color: #9ba69f;
}

.user-row {
    background: #0c110e;
    border: 1px solid #29352d;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
}

.user-row strong {
    display: block;
    margin-bottom: 5px;
}

.user-row small {
    color: #89968e;
}

.approve {
    margin-top: 10px;
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    background: #356447;
    color: white;
    cursor: pointer;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginCard">

    <div class="logo">🎖️</div>

    <h1>TRADOC Orientation</h1>

    <p class="subtitle">
        Authorized Access Portal
    </p>

    <div class="tabs">

        <button
            class="tab active"
            id="userTab"
            onclick="switchLogin('user')">
            USER
        </button>

        <button
            class="tab"
            id="adminTab"
            onclick="switchLogin('admin')">
            ADMIN
        </button>

    </div>


    <!-- USER LOGIN -->

    <form
        id="userForm"
        class="form active"
        onsubmit="userLogin(event)">

        <label>Email</label>

        <input
            type="email"
            id="userEmail"
            placeholder="Enter your email"
            required>

        <label>Password</label>

        <input
            type="password"
            id="userPassword"
            placeholder="Enter your password"
            required>

        <button class="login">
            USER LOGIN
        </button>

    </form>


    <!-- ADMIN LOGIN -->

    <form
        id="adminForm"
        class="form"
        onsubmit="adminLogin(event)">

        <label>Admin Email</label>

        <input
            type="email"
            id="adminEmail"
            placeholder="Enter admin email"
            required>

        <label>Admin Password</label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter admin password"
            required>

        <button class="login">
            ADMIN LOGIN
        </button>

    </form>

    <div id="message" class="message"></div>

</div>


<!-- USER PANEL -->

<div class="card panel" id="userPanel">

    <div class="logo">✓</div>

    <h2>Access Approved</h2>

    <p>
        Your account has been approved.
        You may now access the orientation.
    </p>

    <a
        href="YOUR_CANVA_LINK_HERE"
        target="_blank"
        class="action"
        style="display:block;text-align:center;text-decoration:none;">
        OPEN ORIENTATION
    </a>

    <button
        class="action logout"
        onclick="logout()">
        LOGOUT
    </button>

</div>


<!-- ADMIN PANEL -->

<div class="card panel" id="adminPanel">

    <div class="logo">🛡️</div>

    <h2>Admin Command</h2>

    <p>
        Administrator access granted.
    </p>

    <div id="pendingUsers"></div>

    <button
        class="action logout"
        onclick="logout()">
        LOGOUT
    </button>

</div>

</div>


<script>

/*
=========================================
ADMIN CREDENTIAL
=========================================

IMPORTANT:
This is NOT secure because GitHub Pages
is public.

For a real secure system, use a backend.
*/

const ADMIN_EMAIL = "emieljune79@gmail.com";

/*
Do NOT use your real password here.
Replace this with a temporary demo password
if you understand that it is public.
*/

const ADMIN_PASSWORD = "CHANGE_THIS_PASSWORD";


/*
=========================================
USER DATABASE
=========================================
*/

let users = JSON.parse(
    localStorage.getItem("tradocUsers")
) || [];


/*
=========================================
SWITCH LOGIN
=========================================
*/

function switchLogin(type) {

    const userForm =
        document.getElementById("userForm");

    const adminForm =
        document.getElementById("adminForm");

    const userTab =
        document.getElementById("userTab");

    const adminTab =
        document.getElementById("adminTab");

    clearMessage();

    if (type === "user") {

        userForm.classList.add("active");
        adminForm.classList.remove("active");

        userTab.classList.add("active");
        adminTab.classList.remove("active");

    } else {

        adminForm.classList.add("active");
        userForm.classList.remove("active");

        adminTab.classList.add("active");
        userTab.classList.remove("active");

    }
}


/*
=========================================
USER LOGIN
=========================================
*/

function userLogin(event) {

    event.preventDefault();

    const email =
        document.getElementById("userEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("userPassword")
        .value;

    let user = users.find(
        u => u.email === email
    );

    /*
    First login:
    create pending account.
    */

    if (!user) {

        user = {
            email: email,
            password: password,
            approved: false
        };

        users.push(user);

        saveUsers();

        showMessage(
            "Account created. Waiting for admin approval.",
            "success"
        );

        return;
    }

    /*
    Check password
    */

    if (user.password !== password) {

        showMessage(
            "Incorrect password.",
            "error"
        );

        return;
    }

    /*
    Check approval
    */

    if (!user.approved) {

        showMessage(
            "Your account is still waiting for approval.",
            "error"
        );

        return;
    }

    /*
    Approved
    */

    document.getElementById("loginCard")
        .classList.add("hidden");

    document.getElementById("userPanel")
        .classList.add("active");
}


/*
=========================================
ADMIN LOGIN
=========================================
*/

function adminLogin(event) {

    event.preventDefault();

    const email =
        document.getElementById("adminEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("adminPassword")
        .value;

    if (
        email === ADMIN_EMAIL.toLowerCase() &&
        password === ADMIN_PASSWORD
    ) {

        document.getElementById("loginCard")
            .classList.add("hidden");

        document.getElementById("adminPanel")
            .classList.add("active");

        loadPendingUsers();

    } else {

        showMessage(
            "Invalid admin credentials.",
            "error"
        );
    }
}


/*
=========================================
ADMIN APPROVAL
=========================================
*/

function loadPendingUsers() {

    const container =
        document.getElementById("pendingUsers");

    container.innerHTML = "";

    const pending =
        users.filter(u => !u.approved);

    if (pending.length === 0) {

        container.innerHTML = `
            <p>
                No users are waiting for approval.
            </p>
        `;

        return;
    }

    pending.forEach(user => {

        const row =
            document.createElement("div");

        row.className = "user-row";

        row.innerHTML = `
            <strong>${escapeHTML(user.email)}</strong>
            <small>Pending Approval</small>
            <br>
            <button
                class="approve"
                onclick="approveUser('${encodeURIComponent(user.email)}')">
                APPROVE
            </button>
        `;

        container.appendChild(row);
    });
}


/*
=========================================
APPROVE USER
=========================================
*/

function approveUser(encodedEmail) {

    const email =
        decodeURIComponent(encodedEmail);

    const user =
        users.find(u => u.email === email);

    if (!user) return;

    user.approved = true;

    saveUsers();

    loadPendingUsers();
}


/*
=========================================
SAVE USERS
=========================================
*/

function saveUsers() {

    localStorage.setItem(
        "tradocUsers",
        JSON.stringify(users)
    );
}


/*
=========================================
LOGOUT
=========================================
*/

function logout() {

    document.getElementById("loginCard")
        .classList.remove("hidden");

    document.getElementById("userPanel")
        .classList.remove("active");

    document.getElementById("adminPanel")
        .classList.remove("active");

    document.getElementById("userForm").reset();
    document.getElementById("adminForm").reset();

    switchLogin("user");
}


/*
=========================================
MESSAGES
=========================================
*/

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message show " + type;
}


function clearMessage() {

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className = "message";
}


/*
=========================================
SECURITY FOR DISPLAYED EMAIL
=========================================
*/

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
