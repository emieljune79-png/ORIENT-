<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRADOC | Orientation Portal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #070b09;
    --card: #0e1511;
    --card2: #111a15;
    --border: rgba(255,255,255,.08);
    --green: #3d8b5b;
    --green2: #55b875;
    --text: #f3f7f4;
    --muted: #8d9b92;
}

body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(circle at 50% -20%, rgba(61,139,91,.18), transparent 40%),
        linear-gradient(135deg, #070b09, #0b100d 50%, #070b09);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
}

.glow {
    position: absolute;
    width: 350px;
    height: 350px;
    background: rgba(61,139,91,.08);
    filter: blur(80px);
    border-radius: 50%;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
}

/* MAIN */

.container {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 22px;
    z-index: 2;
}

.card {
    background: rgba(14,21,17,.94);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 34px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.025);
    backdrop-filter: blur(20px);
}

/* HEADER */

.brand {
    text-align: center;
    margin-bottom: 28px;
}

.emblem {
    width: 76px;
    height: 76px;
    margin: auto;
    border-radius: 20px;
    background: linear-gradient(145deg,#17261c,#0c130f);
    border: 1px solid rgba(85,184,117,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    box-shadow:
        0 0 35px rgba(61,139,91,.12),
        inset 0 0 25px rgba(61,139,91,.05);
}

.brand h1 {
    margin-top: 18px;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.brand p {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .4px;
}

/* TABS */

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    padding: 5px;
    background: #090e0b;
    border: 1px solid var(--border);
    border-radius: 13px;
    margin-bottom: 25px;
}

.tab {
    border: none;
    padding: 12px;
    border-radius: 9px;
    background: transparent;
    color: #78867d;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: .2s;
}

.tab.active {
    background: #1b3023;
    color: #dff4e5;
    box-shadow: inset 0 0 0 1px rgba(85,184,117,.15);
}

/* FORMS */

.form {
    display: none;
}

.form.active {
    display: block;
    animation: fade .25s ease;
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

label {
    display: block;
    color: #aab6ae;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
}

.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #65746b;
    font-size: 14px;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 14px 0 40px;
    border-radius: 11px;
    border: 1px solid #26332b;
    outline: none;
    background: #090e0b;
    color: white;
    font-size: 13px;
    transition: .2s;
}

input::placeholder {
    color: #526057;
}

input:focus {
    border-color: rgba(85,184,117,.55);
    box-shadow: 0 0 0 3px rgba(85,184,117,.07);
}

/* BUTTON */

.login-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg,#347a4e,#4b9f66);
    color: white;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .5px;
    cursor: pointer;
    transition: .2s;
}

.login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 25px rgba(61,139,91,.18);
}

.login-btn:active {
    transform: translateY(0);
}

/* MESSAGE */

.message {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    font-size: 12px;
    text-align: center;
}

.message.show {
    display: block;
}

.message.error {
    background: rgba(120,35,35,.18);
    border: 1px solid rgba(180,70,70,.2);
    color: #ffaaa5;
}

.message.success {
    background: rgba(45,120,70,.15);
    border: 1px solid rgba(70,150,90,.2);
    color: #9de0ad;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #4e5b53;
    font-size: 10px;
    margin-top: 22px;
}

/* PANELS */

.panel {
    display: none;
}

.panel.active {
    display: block;
    animation: fade .25s ease;
}

.panel-header {
    text-align: center;
}

.panel-header .emblem {
    margin-bottom: 17px;
}

.panel-header h2 {
    font-size: 22px;
}

.panel-header p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    margin-top: 8px;
}

.action {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border-radius: 11px;
    border: none;
    background: linear-gradient(135deg,#347a4e,#4b9f66);
    color: white;
    text-align: center;
    text-decoration: none;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
}

.logout {
    background: transparent;
    border: 1px solid #29362e;
    color: #8d9b92;
}

.logout:hover {
    background: #111913;
}

/* ADMIN USERS */

.user-list {
    margin-top: 22px;
}

.user {
    padding: 14px;
    background: #090e0b;
    border: 1px solid #26332b;
    border-radius: 11px;
    margin-bottom: 9px;
}

.user-email {
    font-size: 12px;
    font-weight: 700;
}

.status {
    font-size: 10px;
    color: #d4a85d;
    margin-top: 4px;
}

.approve {
    margin-top: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 7px;
    background: #356f49;
    color: white;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="background">
    <div class="grid"></div>
    <div class="glow"></div>
</div>

<div class="container">

<!-- LOGIN CARD -->

<div class="card" id="loginCard">

    <div class="brand">

        <div class="emblem">
            🎖️
        </div>

        <h1>TRADOC ORIENTATION</h1>

        <p>
            SECURE ACCESS PORTAL
        </p>

    </div>


    <div class="tabs">

        <button
            class="tab active"
            id="userTab"
            onclick="switchLogin('user')">

            USER ACCESS

        </button>

        <button
            class="tab"
            id="adminTab"
            onclick="switchLogin('admin')">

            ADMIN ACCESS

        </button>

    </div>


    <!-- USER FORM -->

    <form
        id="userForm"
        class="form active"
        onsubmit="userLogin(event)">

        <label>Email Address</label>

        <div class="input-box">

            <span class="input-icon">✉</span>

            <input
                type="email"
                id="userEmail"
                placeholder="Enter your email"
                autocomplete="off"
                required>

        </div>


        <label>Password</label>

        <div class="input-box">

            <span class="input-icon">●</span>

            <input
                type="password"
                id="userPassword"
                placeholder="Enter your password"
                autocomplete="new-password"
                required>

        </div>


        <button
            class="login-btn"
            type="submit">

            CONTINUE

        </button>

    </form>


    <!-- ADMIN FORM -->

    <form
        id="adminForm"
        class="form"
        onsubmit="adminLogin(event)">

        <label>Administrator Email</label>

        <div class="input-box">

            <span class="input-icon">✉</span>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                autocomplete="off"
                required>

        </div>


        <label>Administrator Password</label>

        <div class="input-box">

            <span class="input-icon">●</span>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="new-password"
                required>

        </div>


        <button
            class="login-btn"
            type="submit">

            ADMIN LOGIN

        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="footer">
        TRADOC • AUTHORIZED PERSONNEL ONLY
    </div>

</div>


<!-- USER PANEL -->

<div
    class="card panel"
    id="userPanel">

    <div class="panel-header">

        <div class="emblem">
            ✓
        </div>

        <h2>ACCESS APPROVED</h2>

        <p>
            Your account has been approved.
            You may now access the orientation material.
        </p>

    </div>


    <!-- CHANGE THIS TO YOUR CANVA LINK -->

    <a
        href="YOUR_CANVA_LINK_HERE"
        target="_blank"
        class="action">

        OPEN ORIENTATION

    </a>


    <button
        class="action logout"
        onclick="logout()">

        SIGN OUT

    </button>

</div>


<!-- ADMIN PANEL -->

<div
    class="card panel"
    id="adminPanel">

    <div class="panel-header">

        <div class="emblem">
            🛡️
        </div>

        <h2>ADMIN COMMAND</h2>

        <p>
            Manage pending orientation access.
        </p>

    </div>


    <div
        class="user-list"
        id="pendingUsers">
    </div>


    <button
        class="action logout"
        onclick="logout()">

        SIGN OUT

    </button>

</div>

</div>


<script>

/* =====================================
   DEMO ADMIN CONFIGURATION
   =====================================

   DO NOT PUT A REAL PASSWORD HERE.

   GitHub Pages is public.
*/

const ADMIN_EMAIL =
    "emieljune79@gmail.com";

const ADMIN_PASSWORD =
    "CHANGE_THIS_PASSWORD";


/* USER STORAGE */

let users =
    JSON.parse(
        localStorage.getItem("tradoc_users")
    ) || [];


/* SWITCH LOGIN */

function switchLogin(type) {

    const userForm =
        document.getElementById("userForm");

    const adminForm =
        document.getElementById("adminForm");

    const userTab =
        document.getElementById("userTab");

    const adminTab =
        document.getElementById("adminTab");

    clearMessage();

    if (type === "user") {

        userForm.classList.add("active");
        adminForm.classList.remove("active");

        userTab.classList.add("active");
        adminTab.classList.remove("active");

    } else {

        adminForm.classList.add("active");
        userForm.classList.remove("active");

        adminTab.classList.add("active");
        userTab.classList.remove("active");

    }
}


/* USER LOGIN */

function userLogin(event) {

    event.preventDefault();

    const email =
        document.getElementById("userEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("userPassword")
        .value;


    let user =
        users.find(
            item => item.email === email
        );


    /* CREATE ACCOUNT */

    if (!user) {

        user = {
            email: email,
            password: password,
            approved: false
        };

        users.push(user);

        saveUsers();

        showMessage(
            "Account created. Please wait for administrator approval.",
            "success"
        );

        return;
    }


    /* PASSWORD */

    if (user.password !== password) {

        showMessage(
            "Incorrect email or password.",
            "error"
        );

        return;
    }


    /* APPROVAL */

    if (!user.approved) {

        showMessage(
            "Your account is pending administrator approval.",
            "error"
        );

        return;
    }


    /* OPEN USER PANEL */

    document
        .getElementById("loginCard")
        .classList.add("hidden");

    document
        .getElementById("userPanel")
        .classList.add("active");
}


/* ADMIN LOGIN */

function adminLogin(event) {

    event.preventDefault();

    const email =
        document.getElementById("adminEmail")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("adminPassword")
        .value;


    if (
        email === ADMIN_EMAIL.toLowerCase() &&
        password === ADMIN_PASSWORD
    ) {

        document
            .getElementById("loginCard")
            .classList.add("hidden");

        document
            .getElementById("adminPanel")
            .classList.add("active");

        loadUsers();

    } else {

        showMessage(
            "Invalid administrator credentials.",
            "error"
        );
    }
}


/* LOAD USERS */

function loadUsers() {

    const container =
        document.getElementById("pendingUsers");

    container.innerHTML = "";


    const pending =
        users.filter(
            user => !user.approved
        );


    if (pending.length === 0) {

        container.innerHTML = `
            <p style="
                text-align:center;
                color:#6f7d74;
                font-size:12px;
                margin-top:20px;
            ">
                No pending users.
            </p>
        `;

        return;
    }


    pending.forEach(user => {

        const div =
            document.createElement("div");

        div.className = "user";

        div.innerHTML = `
            <div class="user-email">
                ${escapeHTML(user.email)}
            </div>

            <div class="status">
                ● PENDING APPROVAL
            </div>

            <button
                class="approve"
                onclick="approveUser('${encodeURIComponent(user.email)}')">

                APPROVE

            </button>
        `;

        container.appendChild(div);

    });
}


/* APPROVE */

function approveUser(encodedEmail) {

    const email =
        decodeURIComponent(encodedEmail);

    const user =
        users.find(
            item => item.email === email
        );

    if (!user) return;

    user.approved = true;

    saveUsers();

    loadUsers();
}


/* SAVE */

function saveUsers() {

    localStorage.setItem(
        "tradoc_users",
        JSON.stringify(users)
    );
}


/* LOGOUT */

function logout() {

    document
        .getElementById("loginCard")
        .classList.remove("hidden");

    document
        .getElementById("userPanel")
        .classList.remove("active");

    document
        .getElementById("adminPanel")
        .classList.remove("active");

    document
        .getElementById("userForm")
        .reset();

    document
        .getElementById("adminForm")
        .reset();

    switchLogin("user");
}


/* MESSAGE */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message show " + type;
}


function clearMessage() {

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className = "message";
}


/* ESCAPE HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
