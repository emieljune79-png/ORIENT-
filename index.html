<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRADOC Orientation</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #0b0f0c;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.card {
    background: #121814;
    border: 1px solid #29352d;
    border-radius: 18px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #1d2b22;
    border: 2px solid #477257;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

.subtitle {
    text-align: center;
    color: #89968e;
    margin-top: 7px;
    margin-bottom: 25px;
    font-size: 14px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
}

.tab {
    flex: 1;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #2c3931;
    background: #18201b;
    color: #9daaa2;
    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    background: #356447;
    color: white;
    border-color: #4b805f;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

label {
    display: block;
    color: #b9c3bd;
    font-size: 13px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 17px;
    border-radius: 9px;
    border: 1px solid #2c3931;
    background: #0c110e;
    color: white;
    outline: none;
}

input:focus {
    border-color: #4b805f;
}

button.login {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #356447;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button.login:hover {
    background: #417a56;
}

.message {
    margin-top: 17px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 13px;
    display: none;
}

.message.show {
    display: block;
}

.message.error {
    background: #351b1b;
    color: #ff9d9d;
}

.message.success {
    background: #193523;
    color: #9ce0ad;
}

.panel {
    display: none;
    text-align: center;
}

.panel.active {
    display: block;
}

.panel h2 {
    margin-bottom: 12px;
}

.panel p {
    color: #9ba69f;
    line-height: 1.5;
    margin-bottom: 20px;
}

.action {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: none;
    background: #356447;
    color: white;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.logout {
    background: transparent;
    border: 1px solid #2c3931;
    color: #9ba69f;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN CARD -->
    <div class="card" id="loginCard">

        <div class="logo">🎖️</div>

        <h1>TRADOC Orientation</h1>
        <p class="subtitle">Authorized Access Portal</p>

        <div class="tabs">

            <button class="tab active" id="userTab"
                onclick="switchLogin('user')">
                USER
            </button>

            <button class="tab" id="adminTab"
                onclick="switchLogin('admin')">
                ADMIN
            </button>

        </div>


        <!-- USER LOGIN -->

        <form id="userForm"
              class="form active"
              onsubmit="userLogin(event)">

            <label>Email</label>

            <input
                type="email"
                id="userEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="userPassword"
                placeholder="Enter your password"
                required
            >

            <button class="login" type="submit">
                USER LOGIN
            </button>

        </form>


        <!-- ADMIN LOGIN -->

        <form id="adminForm"
              class="form"
              onsubmit="adminLogin(event)">

            <label>Admin Email</label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                required
            >

            <label>Admin Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                required
            >

            <button class="login" type="submit">
                ADMIN LOGIN
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>


    <!-- USER PANEL -->

    <div class="card panel" id="userPanel">

        <div class="logo">✓</div>

        <h2>Access Approved</h2>

        <p>
            Your account has been approved.
            You may now access the TRADOC Orientation.
        </p>

        <!-- PUT YOUR CANVA LINK HERE -->

        <a
            href="YOUR_CANVA_LINK_HERE"
            target="_blank"
            class="action">
            OPEN ORIENTATION
        </a>

        <button
            class="action logout"
            onclick="logout()">
            LOGOUT
        </button>

    </div>


    <!-- ADMIN PANEL -->

    <div class="card panel" id="adminPanel">

        <div class="logo">🛡️</div>

        <h2>Admin Command</h2>

        <p>
            Administrator access granted.
        </p>

        <button
            class="action"
            onclick="openApproval()">
            APPROVE USERS
        </button>

        <button
            class="action logout"
            onclick="logout()">
            LOGOUT
        </button>

    </div>

</div>


<script>

function switchLogin(type) {

    const userForm = document.getElementById("userForm");
    const adminForm = document.getElementById("adminForm");

    const userTab = document.getElementById("userTab");
    const adminTab = document.getElementById("adminTab");

    clearMessage();

    if (type === "user") {

        userForm.classList.add("active");
        adminForm.classList.remove("active");

        userTab.classList.add("active");
        adminTab.classList.remove("active");

    } else {

        adminForm.classList.add("active");
        userForm.classList.remove("active");

        adminTab.classList.add("active");
        userTab.classList.remove("active");

    }
}


function userLogin(event) {

    event.preventDefault();

    /*
       SUPABASE AUTH WILL GO HERE.

       User account will be checked for:
       - Valid email
       - Valid password
       - Approval status
    */

    showMessage(
        "User authentication is not connected yet.",
        "error"
    );
}


function adminLogin(event) {

    event.preventDefault();

    /*
       IMPORTANT:
       Do NOT put the admin password here.

       Admin authentication will be handled
       securely by Supabase.
    */

    showMessage(
        "Admin authentication is not connected yet.",
        "error"
    );
}


function openApproval() {

    alert(
        "Approval Management will be connected to the database."
    );

}


function logout() {

    document.getElementById("loginCard")
        .classList.remove("hidden");

    document.getElementById("userPanel")
        .classList.remove("active");

    document.getElementById("adminPanel")
        .classList.remove("active");

    document.getElementById("userForm").reset();
    document.getElementById("adminForm").reset();

    switchLogin("user");
}


function showMessage(text, type) {

    const message = document.getElementById("message");

    message.textContent = text;

    message.className =
        "message show " + type;
}


function clearMessage() {

    const message = document.getElementById("message");

    message.textContent = "";

    message.className = "message";
}

</script>

</body>
</html>
